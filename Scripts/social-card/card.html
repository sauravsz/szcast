<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>szcast — social card</title>
<style>
  :root {
    --bg: #08080b;
    --fg: #f4f4f7;
    --muted: #9aa1ad;
    --accent: #8b5cf6;
    --accent-2: #a78bfa;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }
  .glow {
    position: absolute; left: -80px; top: -260px; width: 760px; height: 620px;
    background: radial-gradient(closest-side, color-mix(in srgb, var(--accent) 30%, transparent), transparent 72%);
  }
  .glow2 {
    position: absolute; right: -140px; bottom: -300px; width: 700px; height: 560px;
    background: radial-gradient(closest-side, color-mix(in srgb, var(--accent) 18%, transparent), transparent 74%);
  }
  .inner { position: absolute; inset: 0; padding: 64px 72px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand img { width: 56px; height: 56px; border-radius: 14px; }
  .brand b { font-size: 30px; font-weight: 620; letter-spacing: -.02em; }
  .brand span {
    margin-left: 6px; font-size: 15px; color: var(--muted);
    border: 1px solid #22222c; border-radius: 999px; padding: 5px 13px;
  }
  h1 {
    margin-top: 54px; font-size: 74px; line-height: 0.98; letter-spacing: -.042em;
    font-weight: 640; max-width: 10ch;
  }
  h1 em { font-style: normal; color: var(--accent-2); }
  p { margin-top: 26px; font-size: 24px; line-height: 1.42; color: var(--muted); max-width: 24ch; }
  .shot {
    position: absolute; right: -40px; bottom: -40px; width: 560px;
    border-radius: 18px; border: 1px solid #22222c; overflow: hidden;
    box-shadow: 0 50px 130px -40px rgba(0,0,0,.95), 0 0 0 1px rgba(255,255,255,.04);
    background: #111117;
  }
  .shot img { width: 100%; display: block; }
  .kbd {
    position: absolute; left: 72px; bottom: 64px;
    display: inline-flex; align-items: center; gap: 12px;
    font-size: 19px; color: var(--muted);
  }
  kbd {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 17px; color: var(--fg); background: #16161d;
    border: 1px solid #22222c; border-bottom-width: 2px;
    border-radius: 8px; padding: 7px 13px;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="glow2"></div>

  <div class="inner">
    <div class="brand">
      <img src="../../site/docs-images/icon.png" alt="" />
      <b>szcast</b><span>macOS</span>
    </div>

    <h1>The launcher that <em>stays native</em>.</h1>
    <p>Keyboard-first, runs Raycast extensions, no Electron.</p>
  </div>

  <div class="shot"><img src="../../site/assets/hero.webp" alt="" /></div>

  <div class="kbd"><kbd>⌘</kbd><kbd>Space</kbd> to open</div>
</body>
</html>

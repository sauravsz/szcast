name: Szcast
options:
  bundleIdPrefix: com.sauravsz.szcast
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    # A stable self-signed identity keeps the Accessibility grant across rebuilds. docs/signing.md
    CODE_SIGN_IDENTITY: "Szcast Self-Signed"
    SWIFT_STRICT_CONCURRENCY: complete
    SZCAST_BUNDLE_IDENTIFIER: com.sauravsz.szcast
    SZCAST_URL_SCHEME: szcast
  configs:
    Debug:
      SZCAST_BUNDLE_IDENTIFIER: com.sauravsz.szcast.dev
      # Its own scheme too, so a link never lands in whichever channel macOS happens to pick.
      SZCAST_URL_SCHEME: szcast-dev
      DICTATION_EXECUTABLE_NAME: szcast Dev Dictation
    Release:
      DICTATION_EXECUTABLE_NAME: szcast Dictation
      # Release-only: library validation refuses Debug's `.debug.dylib`, whose team never matches.
      ENABLE_HARDENED_RUNTIME: YES
      # Strip the shipped binary (dSYM is still generated first) and drop unused code.
      DEPLOYMENT_POSTPROCESSING: YES
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_SWIFT_SYMBOLS: YES
      DEAD_CODE_STRIPPING: YES

targets:
  Szcast:
    type: application
    platform: macOS
    sources:
      - path: Szcast
        # Helper-only sources: compiling them in would link Vision and PDFKit into the app.
        excludes:
          - Features/Clipboard/Service/ClipboardTextExtractor.swift
          - Features/Clipboard/Service/ClipboardTextHelper.swift
          - Features/Dictation/Helper
          - Features/FileSearch/Helper
          - Resources/EmojiKeywords
      # A folder reference keeps the packs in their own directory, which `EmojiIndex` lists.
      - path: Szcast/Resources/EmojiKeywords
        type: folder
      # The MIT mark's licence asks the notice to travel with the binary, not just the repo.
      - path: NOTICE.md
        buildPhase: resources
    dependencies:
      - target: DictationHelper
        link: false
        embed: false
      # Resolve the embedded helper against the active channel, not Xcode's default configuration.
      - framework: "$(BUILT_PRODUCTS_DIR)/$(DICTATION_EXECUTABLE_NAME).app"
        link: false
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - target: ClipboardTextHelper
        link: false
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      # The crawl runs out of process, so its memory is returned when the helper exits.
      - target: FileIndexHelper
        link: false
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(SZCAST_BUNDLE_IDENTIFIER)"
        INFOPLIST_FILE: Szcast/Info.plist
        CODE_SIGN_ENTITLEMENTS: Szcast/Szcast.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: szcast
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
      configs:
        # The product name is what macOS shows: `szcast`, not the target's capitalisation.
        Release:
          PRODUCT_NAME: szcast
        # Debug is its own channel, so a local build never corrupts the installed app's state.
        Debug:
          PRODUCT_NAME: szcast Dev

  ClipboardTextHelper:
    type: tool
    platform: macOS
    sources:
      - Szcast/Features/Clipboard/Service/ClipboardTextExtractor.swift
      - Szcast/Features/Clipboard/Service/ClipboardTextHelper.swift
    settings:
      base:
        # Pinned, or release.yml's PRODUCT_NAME renames the binary `ClipboardTextWorker` looks for.
        EXECUTABLE_NAME: ClipboardTextHelper
        PRODUCT_MODULE_NAME: ClipboardTextHelper
        SKIP_INSTALL: YES

  FileIndexHelper:
    type: tool
    platform: macOS
    sources:
      - Szcast/Features/FileSearch/Helper/FileIndexHelper.swift
      - Szcast/Features/FileSearch/Model/FileSearchIgnoreList.swift
      - Szcast/Features/FileSearch/Model/FileSearchPolicy.swift
      - Szcast/Features/FileSearch/Model/FileSearchQuery.swift
      - Szcast/Features/FileSearch/Model/FileSearchResult.swift
      - Szcast/Features/FileSearch/Model/FileSearchScope.swift
      - Szcast/Features/FileSearch/Service/FileIndexCrawler.swift
      - Szcast/Features/FileSearch/Service/FileIndexSnapshot.swift
    settings:
      base:
        # Pinned like ClipboardTextHelper's: release.yml's PRODUCT_NAME would otherwise rename it.
        EXECUTABLE_NAME: FileIndexHelper
        PRODUCT_MODULE_NAME: FileIndexHelper
        SKIP_INSTALL: YES
        SWIFT_OPTIMIZATION_LEVEL: -O

  DictationHelper:
    type: application
    platform: macOS
    info:
      path: Szcast/Features/Dictation/Helper/Info.plist
      properties:
        CFBundleName: "$(DICTATION_EXECUTABLE_NAME)"
        CFBundleDisplayName: "$(DICTATION_EXECUTABLE_NAME)"
        LSUIElement: true
    sources:
      - Szcast/Features/Dictation/Helper
      - Szcast/Features/Dictation/Model/DictationModel.swift
      - Szcast/Features/Dictation/Model/DictationAudioChunks.swift
      - Szcast/Features/Dictation/Model/DictationLanguage.swift
      - Szcast/Features/Dictation/Model/TimedTranscript.swift
      - Szcast/Features/Dictation/Model/SpeakerClustering.swift
      - Szcast/Features/Dictation/Service/DictationWire.swift
    settings:
      base:
        EXECUTABLE_NAME: "$(DICTATION_EXECUTABLE_NAME)"
        PRODUCT_NAME: "$(DICTATION_EXECUTABLE_NAME)"
        WRAPPER_NAME: "$(DICTATION_EXECUTABLE_NAME).app"
        PRODUCT_MODULE_NAME: DictationHelper
        PRODUCT_BUNDLE_IDENTIFIER: "$(SZCAST_BUNDLE_IDENTIFIER).dictation"
        SKIP_INSTALL: YES
        SWIFT_OPTIMIZATION_LEVEL: -O

  szcast-cli:
    type: tool
    platform: macOS
    sources:
      - Szcast/Features/Dictation/CLI/SzcastCLI.swift
      - Szcast/Features/Dictation/Helper/DictationTensor.swift
      - Szcast/Features/Dictation/Helper/DictationMel.swift
      - Szcast/Features/Dictation/Helper/DictationTokenizer.swift
      - Szcast/Features/Dictation/Helper/ParakeetRecognizer.swift
      - Szcast/Features/Dictation/Helper/QwenRecognizer.swift
      - Szcast/Features/Dictation/Helper/NemotronRecognizer.swift
      - Szcast/Features/Dictation/Helper/WhisperApexRecognizer.swift
      - Szcast/Features/Dictation/Helper/IndicFlexRecognizer.swift
      - Szcast/Features/Dictation/Helper/SileroVADProcessor.swift
      - Szcast/Features/Dictation/Helper/SpeakerDiarizer.swift
      - Szcast/Features/Dictation/Helper/DictationInferenceRunner.swift
      - Szcast/Features/Dictation/Model/DictationModel.swift
      - Szcast/Features/Dictation/Model/DictationSupportModel.swift
      - Szcast/Features/Dictation/Model/DictationAudioChunks.swift
      - Szcast/Features/Dictation/Model/DictationLanguage.swift
      - Szcast/Features/Dictation/Model/TimedTranscript.swift
      - Szcast/Features/Dictation/Model/SpeakerClustering.swift
      - Szcast/Features/Dictation/Model/DictationHistoryItem.swift
      - Szcast/Features/Dictation/Model/MeetingNote.swift
      - Szcast/Features/Dictation/Model/TranscriptExporter.swift
      - Szcast/Features/Dictation/Model/TranscriptStore.swift
      - Szcast/Features/Dictation/Service/DictationWire.swift
      - Szcast/Features/Dictation/Service/DictationModelDownloader.swift
      - Szcast/Features/Dictation/Service/DictationFileTranscriber.swift
      - Szcast/Features/Dictation/Service/MediaFetchService.swift
      - Szcast/Features/Dictation/Service/TranscriptPDFExporter.swift
      - Szcast/Platform/AppPaths.swift
      - Szcast/Platform/ExecutableLocator.swift
      - Szcast/Platform/ProcessExit.swift
      - Szcast/Platform/Compression/Zlib.swift
    settings:
      base:
        EXECUTABLE_NAME: szcast-cli
        PRODUCT_NAME: szcast-cli
        PRODUCT_MODULE_NAME: szcast_cli
        SKIP_INSTALL: YES
        SWIFT_OPTIMIZATION_LEVEL: -O
